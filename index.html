data-exact-id":`xK2DY5K6auF3BO8DQsUIGNr`},`C# lowers an async method into a resumable state machine. It preserves local data between steps, records where execution should continue, and advances the method when awaited work settles. That design is closely related to iterator lowering, and .NET 4 already had iterators. That gave me an idea.`),N(`p`,{"data-exact-id":`xNKpZy2cHShhDXdWTTIxqb0`},`After several trips down the rabbit hole, I built a small package that expressed asynchronous operations with iterator blocks. I had to write `,N(`code`,{"data-exact-id":`xWbz2q2TGNkUqGlBGktLXx_`},`yield return`),` instead of `,N(`code`,{"data-exact-id":`x5jXryndSWRpM3nljUeX1vy`},`await`),`, but an iterator runner could feed each completed result back into the suspended function. Extension methods wrapped the runner and preserved typed results with generics.`),P($,{source:F(()=>yS),language:`csharp`,title:`The iterator-shaped C# experiment`}),N(`p`,{"data-exact-id":`xTKI6o9ptIei5fOw6wrSTaf`},`It was a toy, but it taught me something durable: a programmer can write the clearest version of an idea while the compiler generates the bookkeeping. The transformed program may contain states, continuations, and careful error handling; the authored program does not need to advertise all of that machinery.`)),N(`section`,{"data-exact-id":`xslGQDzArIjG-zCn4Z8tEzr`},N(`h2`,{"data-exact-id":`xQgY4DSUeqmv-vtYes7yUST`},`JavaScript completed the circle`),N(`p`,{"data-exact-id":`xiMZnE5QMN1KLhkNKF2dSbH`},`JavaScript standardized generators before `,N(`code`,{"data-exact-id":`xfwTioOP-yd6c_42Bv94wkn`},`async`),`/`,N(`code`,{"data-exact-id":`xeJiY0mroFKnDHEQHcYECaz`},`await`),`. During the long period when browser support varied, tools such as Babel and TypeScript could lower newer syntax into generator-like or explicit state-machine code for older targets. Modern engines support async functions directly and may optimize them in different ways; the language specification defines their observable beh
