[package]
name = "exact-ssr-load-driver"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
publish = false
license = "Apache-2.0"
authors = ["Joshua Friesen"]

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["clock"] }
futures-util = "0.3"
hdrhistogram = { version = "7", default-features = false }
libc = "0.2"
regex = "1"
reqwest = { version = "0.13.5", default-features = false, features = ["stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["rt", "macros", "time", "signal", "sync"] }

[profile.release]
lto = "thin"
codegen-units = 1
