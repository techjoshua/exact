<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<meta
			name="description"
			content="Learn eXact through friendly explanations, live components, and a tiny Logo language lab."
		/>
		<meta name="theme-color" content="#f4f1e9" />
		<title>eXact documentation</title>
		<script>
			(() => {
				try {
					const preference = localStorage.getItem('exact-theme-appearance');
					if (preference === 'light' || preference === 'dark') {
						document.documentElement.dataset.theme = preference;
					}
				} catch {}
			})();
		</script>
	</head>
	<body>
		<div id="app"></div>
		<script type="module" src="/src/entry-client.tsx"></script>
	</body>
</html>
