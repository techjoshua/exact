name: Publish Pages apps

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: gh-pages
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.2'
          cache: false
      - run: npm ci
      - name: Build framework workspaces
        run: npm run build
      - name: Build standalone documentation
        run: npm run build -w @exactjs/docs
      - name: Build standalone Sudoku
        run: npm run build:sudoku:standalone
      - name: Build standalone Puzzle Foundry
        run: npm run build:puzzle-generator:standalone
      - name: Assemble Pages branch
        run: node scripts/prepare-gh-pages.mjs
      - name: Publish gh-pages branch
        uses: peaceiris/actions-gh-pages@84c30a85c19949d7eee79c4ff27748b70285e453 # v4.1.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: ./.tmp/gh-pages
          commit_message: 'Deploy documentation and sample apps'
